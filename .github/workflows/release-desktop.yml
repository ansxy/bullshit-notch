name: Release Desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Smoke test
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: Package
        run: bash desktop/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/bullshit-notch-linux-x86_64.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/bullshit-notch-linux-x86_64.tar.gz
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Check
        run: cargo check --manifest-path desktop/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --manifest-path desktop/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: ./desktop/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/bullshit-notch-windows-x86_64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/bullshit-notch-windows-x86_64.zip
          generate_release_notes: true
